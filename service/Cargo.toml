# The whiteboard service: serves the board (Excalidraw, ../frontend, built
# into the binary) under /whiteboard/ for the plugin's [[proxy]].
# Build: (cd ../frontend && npm ci && npm run build) && cargo build --release
[package]
name = "rc-whiteboard-service"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "query"] }
mime_guess = "2"
rust-embed = "8"
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal"] }
tower-http = { version = "0.6", features = ["compression-gzip", "compression-br"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"

[profile.release]
opt-level = 3
lto = true
strip = true

# Not part of the plugin's workspace: a native binary.
[workspace]
