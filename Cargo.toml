# rc-whiteboard ("Whiteboard"): Excalidraw boards of the user's files for
# RustCloud, a WASM plugin built on its own.
# Build: cargo build --release --target wasm32-wasip2
[package]
name = "rc-whiteboard"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde_json = "1"
wit-bindgen = "0.63"

[profile.release]
opt-level = "s"
lto = true
strip = true

# Not part of any workspace: built for wasm32-wasip2 on its own. The service
# (service/) is a crate of its own too.
[workspace]
